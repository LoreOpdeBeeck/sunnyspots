name: Refresh café list and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * *'        # every morning ~05:15/06:15 Antwerp time
  workflow_dispatch:            # "Run workflow" button on the Actions tab

permissions:
  contents: write               # to save the refreshed café list
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh café & coffee bar list from OpenStreetMap
        # If the data servers are busy, keep yesterday's list instead of failing the deploy.
        run: node update-cafes.mjs || echo "::warning::Café list refresh failed, keeping the previous list"

      - name: Save the refreshed list in the repository
        run: |
          if [ -f antwerp-cafes.json ] && [ -n "$(git status --porcelain antwerp-cafes.json)" ]; then
            git config user.name "sunnyspots-bot"
            git config user.email "sunnyspots-bot@users.noreply.github.com"
            git add antwerp-cafes.json
            git commit -m "Refresh café list"
            git push || echo "::warning::Could not save the list (it is still published below)"
          fi

      - name: Collect the website files
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
          if [ -f antwerp-cafes.json ]; then cp antwerp-cafes.json _site/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
