<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunny cafés and coffee bars · Antwerp</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>window.maplibregl || document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f2430; --muted:#6b6f7a; --line:#e9e1d1; --sun:#ffb300; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0;background:#eae6dc}
  .panel{position:absolute;z-index:3;top:14px;left:14px;width:320px;max-height:calc(100% - 150px);display:flex;flex-direction:column;
    background:#fffdf8f2;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 34px #0002;overflow:hidden}
  .panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{font-family:Fraunces,serif;font-size:21px;margin:0;display:flex;gap:8px;align-items:center}
  h1 .dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd75e,var(--sun));box-shadow:0 0 0 4px #ffd75e55}
  #count{font-size:13px;color:var(--muted);margin-top:8px}
  .sub{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
  #ohnote{color:#c2410c}
  #search{width:100%;font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
  #search:focus{border-color:var(--sun);box-shadow:0 0 0 3px #ffd75e55}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cafe .u.sun::before{content:"☀ ";color:var(--sun)}
  .cafe .u.closed{color:#b45309}
  .cafe .u.dim{color:var(--muted)}
  .cafe.is-closed .n{color:var(--muted)}
  .maplibregl-popup-content .kind{font-size:12px;color:var(--muted)}
  .oh{font-size:12.5px;margin:2px 0 4px;color:var(--muted)}
  .oh.open{color:#2f7d32;font-weight:600}
  .oh.closed{color:#b45309;font-weight:600}
  #count b{color:var(--ink)}
  #list{overflow:auto;padding:6px}
  .cafe{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px}
  .cafe:hover{background:#f6efe1}
  .cafe .n{font-weight:500}
  .cafe .u{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .hint{padding:14px 16px;color:var(--muted);font-size:13.5px;line-height:1.45}
  .timebar{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:22px;width:min(720px,calc(100% - 28px));
    background:#fffdf8f2;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 34px #0002;padding:10px 14px 12px}
  .tb-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .clock{font-family:Fraunces,serif;font-size:26px;font-variant-numeric:tabular-nums;min-width:86px}
  .sun-info{font-size:12.5px;color:var(--muted);flex:1}
  .clouds{height:7px;border-radius:4px;margin-top:5px;background:#eee;display:none}
  .clouds.on{display:block}
  .wx{white-space:nowrap}
  .btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;height:32px;padding:0 10px;cursor:pointer}
  .btn:hover{background:#f6efe1}
  .quick{display:flex;gap:4px}
  .btn.q{height:30px;padding:0 9px;font-size:12.5px}
  .btn.q.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cloudwrap{position:relative;margin-top:5px;height:7px}
  .cloudwrap .clouds{margin-top:0;display:block}
  .past{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px 0 0 4px;pointer-events:none;
    background:repeating-linear-gradient(135deg,#fffdf8cc 0 3px,#0000 3px 6px)}
  .legend{border-top:1px solid var(--line);padding:8px 14px;font-size:12.5px;color:var(--muted)}
  .legend summary{cursor:pointer;color:var(--ink);font-weight:500}
  .legend ul{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:6px}
  .legend li{display:flex;align-items:center;gap:8px}
  .sw{display:inline-block;flex:none;width:20px;height:12px;border-radius:3px}
  .sw.dot{width:10px;height:10px;margin:0 5px;border-radius:50%;background:#7d8797;border:1.5px solid #fff;box-shadow:0 0 0 1px #0002}
  .sw.dot.faded{background:#b7bcc6;opacity:.55}
  .sw.shadow{background:#14183c;opacity:.35}
  .sw.me{width:12px;height:12px;margin:0 4px;border-radius:50%;background:#1da1f2;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
  .sw.strip{width:20px;height:7px;background:linear-gradient(90deg,#ffd75e,#c8cbd2)}
  .zoomin{margin:4px 16px 12px}
  .skycheck{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);order:2}
  .panel header{order:1} #list{order:3} .legend{order:4}
  .skycheck button{font:inherit;font-size:15px;line-height:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;cursor:pointer}
  .skycheck button:hover{background:#f6efe1}
  .skycheck button[data-sky=""]{font-size:12.5px;border:0;background:none;color:#c2410c;text-decoration:underline;padding:0}
  .pop-actions{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12.5px}
  .pop-actions button{font:inherit;color:#c2410c;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
  .maplibregl-popup-content{max-height:min(60vh,460px);overflow:auto}
  #slider{width:100%;margin:0;accent-color:var(--sun)}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  #loading{font-size:11.5px;color:var(--muted);margin-left:auto}
  .maplibregl-popup-content{font-family:Inter,sans-serif;font-size:13px;line-height:1.45;border-radius:12px;padding:12px 14px}
  .maplibregl-popup-content h3{font-family:Fraunces,serif;font-size:17px;margin:0 0 4px}
  .now-sun{color:#a86a00;font-weight:600}
  .now-shade{color:#55607a;font-weight:600}
  .maplibregl-popup-content ul{margin:6px 0;padding-left:18px}
  .maplibregl-popup-content a{color:#c2410c}
  .err{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:#fbf7ef;padding:30px;text-align:center;font-size:15px;color:#c2410c}
  .titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sheet-btn{display:none;font:inherit;border:1px solid var(--line);background:#fff;border-radius:99px;width:34px;height:34px;cursor:pointer;flex:none}
  .searchrow{display:flex;gap:6px}
  .searchrow .btn{height:auto;white-space:nowrap}
  #nearme.on{background:#e8f1ff;border-color:#9cc0ff}
  #best .best{margin:0 0 6px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#fff4cc,#ffe08a);border:1px solid #f3cf63;cursor:pointer}
  #best .best:focus{outline:3px solid #ffd75e}
  #best .best.muted{background:#f4f1ea;border-color:var(--line);color:var(--muted);font-size:13px;cursor:default}
  #best .best.muted[data-id]{cursor:pointer}
  .best-k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a5a00;font-weight:600}
  .best-n{font-family:Fraunces,serif;font-size:18px;margin:2px 0}
  .best-d{font-size:13px;color:#5a3d00}
  .more .chips{margin-bottom:2px}
  .searchrow{margin-top:8px}
  .fine{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
  @media (max-width:700px){
    .panel{top:auto;bottom:112px;left:8px;right:8px;width:auto;max-height:calc(100% - 130px);border-radius:16px 16px 12px 12px}
    .panel:not(.expanded) .more{display:none}
    /* phones: search + filters as an always-visible bar at the top of the screen */
    .searchbox{position:fixed;z-index:4;top:8px;left:8px;right:8px;padding:8px;background:#fffdf8f5;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 22px #0002}
    .searchbox .searchrow{margin-top:0}
    .searchbox .chips{margin-top:6px;flex-wrap:nowrap;overflow-x:auto}
    .searchbox .chip{white-space:nowrap}
    .maplibregl-ctrl-top-right{top:104px !important}
    /* phones: "Sky right now?" at the bottom of the sheet, just above the time bar */
    .skycheck{order:9;border-bottom:0;border-top:1px solid var(--line);padding:7px 12px}
    .panel{max-height:calc(100% - 230px)}
    .panel:not(.expanded) #count{display:none}
    .panel header{padding:10px 12px 8px}
    h1{font-size:17px}
    .sub{margin-bottom:6px}
    .sheet-btn{display:block}
    .timebar{bottom:8px;padding:8px 10px 8px;width:calc(100% - 16px)}
    .tb-top{gap:8px;margin-bottom:4px;flex-wrap:wrap}
    .btn.q{padding:0 7px;font-size:12px}
    .clock{font-size:21px;min-width:58px}
    .sun-info{font-size:11.5px}
    .ticks{display:none}
    .sun-info{order:3;flex-basis:100%}
    .maplibregl-popup-content{max-height:42vh}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <header>
    <div class="titlebar">
      <h1><span class="dot"></span>Sunny cafés and coffee bars</h1>
      <button id="sheet" class="sheet-btn" aria-expanded="true" aria-label="Show or hide the list">▼</button>
    </div>
    <div class="sub">Antwerp · today <span id="ohnote"></span></div>
    <div id="best"></div>
    <div class="searchbox">
      <div class="searchrow">
        <input id="search" type="search" placeholder="Search a café or coffee bar…" autocomplete="off" aria-label="Search a café or coffee bar">
        <button id="nearme" class="btn" title="Use my location">📍 Near me</button>
      </div>
      <div class="chips" role="group" aria-label="Filters">
        <button class="chip on" data-f="coffee" aria-pressed="true">☕ Coffee bars</button>
        <button class="chip on" data-f="cafe" aria-pressed="true">🍺 Cafés</button>
        <button class="chip" data-f="openOnly" aria-pressed="false">Show only open</button>
      </div>
    </div>
    <div id="count">Loading the map…</div>
  </header>
  <div id="skycheck" class="skycheck" aria-live="polite"></div>
  <div id="list" class="more"></div>
  <details class="legend more">
    <summary>Map legend</summary>
    <ul>
      <li><svg viewBox="-12 -12 24 24" width="20" height="20" aria-hidden="true"><g stroke="#b26b00" stroke-width="1.6" stroke-linecap="round"><line x1="0" y1="-11" x2="0" y2="-8"/><line x1="0" y1="11" x2="0" y2="8"/><line x1="-11" y1="0" x2="-8" y2="0"/><line x1="11" y1="0" x2="8" y2="0"/><line x1="-7.8" y1="-7.8" x2="-5.7" y2="-5.7"/><line x1="7.8" y1="7.8" x2="5.7" y2="5.7"/><line x1="-7.8" y1="7.8" x2="-5.7" y2="5.7"/><line x1="7.8" y1="-7.8" x2="5.7" y2="-5.7"/></g><circle r="5.5" fill="#ffc400" stroke="#b26b00" stroke-width="1.4"/></svg> In the sun (paler when it's cloudy)</li>
      <li><span class="sw dot"></span> In the shade</li>
      <li><span class="sw dot faded"></span> Closed at the chosen time</li>
      <li><span class="sw shadow"></span> Building shadow</li>
      <li><span class="sw me"></span> You</li>
      <li><span class="sw strip"></span> Sky through the day: yellow = clear, grey = cloudy. Hatched = already past.</li>
      <li>☕ Coffee bar · 🍺 Café</li>
    </ul>
  </details>
</div>
<div class="timebar">
  <div class="tb-top">
    <div class="clock" id="clock">--:--</div>
    <div class="sun-info" id="suninfo"></div>
    <div class="quick" role="group" aria-label="Jump to a time">
      <button class="btn q" data-q="0">Now</button>
      <button class="btn q" data-q="30">+30 min</button>
      <button class="btn q" data-q="60">+1 h</button>
      <button class="btn q" data-q="120">+2 h</button>
    </div>
  </div>
  <input type="range" id="slider" min="0" max="143" value="72" aria-label="Time of day">
  <div class="cloudwrap"><div class="clouds" id="clouds" title="Sky through the day: yellow = clear, grey = cloudy"></div><div class="past" id="past" title="Earlier today"></div></div>
  <div class="ticks" id="ticks"></div>
</div>

<!-- Background worker: downloads each map tile once, decodes buildings + cafés, prepares GPU buffers. -->
<script id="worker-src" type="text/plain">
try { importScripts('https://unpkg.com/earcut@2.2.4/dist/earcut.min.js'); }
catch(e){ try { importScripts('https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js'); } catch(e2){} }
const DEFAULT_H = 11;
let O = null;
const td = new TextDecoder();

function R(b){ this.b = b; this.p = 0; this.dv = new DataView(b.buffer, b.byteOffset, b.byteLength); }
R.prototype.v = function(){ const b = this.b; let r = 0, s = 1, c; do { c = b[this.p++]; r += (c & 0x7f) * s; s *= 128; } while (c >= 0x80); return r; };
R.prototype.skip = function(wt){ if (wt === 0) this.v(); else if (wt === 1) this.p += 8; else if (wt === 2) this.p += this.v(); else if (wt === 5) this.p += 4; else throw new Error('bad wire type'); };
R.prototype.str = function(){ const l = this.v(); const s = td.decode(this.b.subarray(this.p, this.p + l)); this.p += l; return s; };
R.prototype.packed = function(){ const l = this.v(), end = this.p + l, out = []; while (this.p < end) out.push(this.v()); return out; };
const zz = n => (n >>> 1) ^ -(n & 1);

function readValue(r, end){
  let val = null;
  while (r.p < end){
    const t = r.v(), f = t >> 3, wt = t & 7;
    if (f === 1) val = r.str();
    else if (f === 2){ val = r.dv.getFloat32(r.p, true); r.p += 4; }
    else if (f === 3){ val = r.dv.getFloat64(r.p, true); r.p += 8; }
    else if (f === 4 || f === 5) val = r.v();
    else if (f === 6) val = zz(r.v());
    else if (f === 7) val = !!r.v();
    else r.skip(wt);
  }
  return val;
}
function readLayer(r, end){
  const L = { name:'', keys:[], values:[], extent:4096, feats:[] };
  while (r.p < end){
    const t = r.v(), f = t >> 3, wt = t & 7;
    if (f === 1) L.name = r.str();
    else if (f === 2){ const l = r.v(); L.feats.push([r.p, r.p + l]); r.p += l; }
    else if (f === 3) L.keys.push(r.str());
    else if (f === 4){ const l = r.v(); L.values.push(readValue(r, r.p + l)); }
    else if (f === 5) L.extent = r.v();
    else r.skip(wt);
  }
  return L;
}
function readFeature(r, [s, e], L){
  r.p = s; let tags = [], type = 0, geom = [];
  while (r.p < e){
    const t = r.v(), f = t >> 3, wt = t & 7;
    if (f === 2) tags = r.packed();
    else if (f === 3) type = r.v();
    else if (f === 4) geom = r.packed();
    else r.skip(wt);
  }
  const props = {};
  for (let i = 0; i < tags.length; i += 2) props[L.keys[tags[i]]] = L.values[tags[i+1]];
  return { type, props, geom };
}
function decodeRings(g){
  const rings = []; let x = 0, y = 0, i = 0, ring = null;
  while (i < g.length){
    const c = g[i++], id = c & 7, n = c >> 3;
    if (id === 1 || id === 2){
      for (let k = 0; k < n; k++){ x += zz(g[i++]); y += zz(g[i++]); if (id === 1){ ring = []; rings.push(ring); } ring.push(x, y); }
    }
  }
  return rings;
}
function area(r){ let a = 0; for (let i = 0, n = r.length/2; i < n; i++){ const j = (i+1) % n; a += r[2*i]*r[2*j+1] - r[2*j]*r[2*i+1]; } return a; }
function polygons(rings){
  const polys = []; let ccw, cur = null;
  for (const r of rings){
    const a = area(r); if (a === 0) continue;
    if (ccw === undefined) ccw = a < 0;
    if (ccw === (a < 0)){ cur = [r]; polys.push(cur); } else if (cur) cur.push(r);
  }
  return polys;
}

function processTile(buf, z, tx, ty){
  const r = new R(buf), layers = {};
  while (r.p < buf.length){
    const t = r.v(), f = t >> 3, wt = t & 7;
    if (f === 3){ const l = r.v(), end = r.p + l; const L = readLayer(r, end); r.p = end; if (L.name === 'building' || L.name === 'poi') layers[L.name] = L; }
    else r.skip(wt);
  }
  const n2 = Math.pow(2, z);
  // GPU arrays (x east, y south, local metres) and CPU arrays (x east, y north)
  const gv = [], gi = [], roofs = [];
  const cc = [], ringStart = [], polyRing = [], polyH = [], polyBB = [];
  const B = layers.building;
  if (B){
    const ext = B.extent;
    for (const fr of B.feats){
      const ft = readFeature(r, fr, B);
      if (ft.type !== 3) continue;
      const p = ft.props;
      if (p.hide_3d === true || (+p.render_min_height || 0) > 3) continue;
      let h = +p.render_height; if (!(h > 5)) h = DEFAULT_H;
      for (const poly of polygons(decodeRings(ft.geom))){
        // project rings
        const lr = poly.map(ring => { const out = new Array(ring.length);
          for (let i = 0; i < ring.length; i += 2){ out[i] = ((tx + ring[i]/ext)/n2 - O.ox)/O.mpu; out[i+1] = ((ty + ring[i+1]/ext)/n2 - O.oy)/O.mpu; }
          return out; });
        // GPU: base verts for all rings, then top verts
        const base = gv.length/3; let total = 0; const starts = [];
        for (const ring of lr){ starts.push(total); total += ring.length/2; }
        for (const ring of lr) for (let i = 0; i < ring.length; i += 2) gv.push(ring[i], ring[i+1], 0);
        for (const ring of lr) for (let i = 0; i < ring.length; i += 2) gv.push(ring[i], ring[i+1], h);
        lr.forEach((ring, k) => {
          const n = ring.length/2, s0 = base + starts[k];
          for (let i = 0; i < n; i++){
            const a = s0 + i, b = s0 + (i+1) % n, at = a + total, bt = b + total;
            gi.push(a, b, bt, a, bt, at);
          }
        });
        if (self.earcut){
          const flat = [], holes = [];
          lr.forEach((ring, k) => { if (k) holes.push(flat.length/2); for (const v of ring) flat.push(v); });
          const tri = earcut(flat, holes.length ? holes : null, 2);
          for (const t of tri) roofs.push(base + t);
        }
        // CPU
        polyRing.push(ringStart.length);
        let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
        for (const ring of lr){
          ringStart.push(cc.length/2);
          for (let i = 0; i < ring.length; i += 2){ const x = ring[i], y = -ring[i+1]; cc.push(x, y); if (x < x1) x1 = x; if (x > x2) x2 = x; if (y < y1) y1 = y; if (y > y2) y2 = y; }
        }
        polyH.push(h); polyBB.push(x1, y1, x2, y2);
      }
    }
  }
  ringStart.push(cc.length/2); polyRing.push(ringStart.length - 1);
  const cafes = [];
  const P = layers.poi;
  if (P){
    for (const fr of P.feats){
      const ft = readFeature(r, fr, P);
      const cls = ft.props.class;
      if (ft.type !== 1 || !(cls === 'cafe' || cls === 'beer' || cls === 'bar' || /^(bar|pub|biergarten)$/.test(ft.props.subclass || ''))) continue;
      const g = ft.geom; if (g.length < 3) continue;
      const px = zz(g[1]), py = zz(g[2]);
      if (px < 0 || py < 0 || px > P.extent || py > P.extent) continue; // skip buffer copies from neighbouring tiles
      const mx = (tx + px/P.extent)/n2, my = (ty + py/P.extent)/n2;
      cafes.push({ name: ft.props['name:latin'] || ft.props.name || '', sub: ft.props.subclass || '', cls,
        lng: mx*360 - 180, lat: Math.atan(Math.sinh(Math.PI*(1 - 2*my)))*180/Math.PI,
        x: (mx - O.ox)/O.mpu, y: -(my - O.oy)/O.mpu });
    }
  }
  const idx = new Uint32Array(gi.length + roofs.length); idx.set(gi); idx.set(roofs, gi.length);
  return { verts:new Float32Array(gv), idx, quadCount:gi.length, roofCount:roofs.length,
    cc:new Float32Array(cc), ringStart:new Uint32Array(ringStart), polyRing:new Uint32Array(polyRing), polyH:new Float32Array(polyH), polyBB:new Float32Array(polyBB), cafes };
}

<script>
"use strict";
if (!window.maplibregl){

const $ = s => document.querySelector(s);
window.addEventListener('error', e => { const el = document.getElementById('count'); if (el) el.innerHTML = '<span style="color:#c2410c">Something went wrong: ' + String(e.message).replace(/</g,'&lt;') + '</span>'; });

const RAD = Math.PI/180, TZ = 'Europe/Brussels';
const STEP_MIN = 10, EYE = 1.2, MIN_ALT = 2, NEAR_R = 170, TZOOM = 14;
const ANTWERP = { center:[4.4025, 51.2194], bounds:[[4.25, 51.14], [4.55, 51.33]] };

/* ---------- time (always Antwerp time) ---------- */
function tzOffsetMs(utcMs){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})

function sunPos(ms, lat, lon){

}
const compass = az => ['N','NE','E','SE','S','SW','W','NW'][Math.round(az/45) % 8];

/* ---------- local frame: metres around Antwerp centre ---------- */
const mercX = lon => (lon + 180)/360;
const mercY = lat => (1 - Math.log(Math.tan(lat*RAD) + 1/Math.cos(lat*RAD))/Math.PI)/2;
const ORIGIN = { ox:mercX(ANTWERP.center[0]), oy:mercY(ANTWERP.center[1]), mpu:1/(2*Math.PI*6378137*Math.cos(ANTWERP.center[1]*RAD)) };

/* ---------- building store (CPU side, for café sun checks) ---------- */
const CELL = 60, grid = new Map();
function addBuildings(T){
  const n = T.polyH.length;

    const b = { T, p, h:T.polyH[p], bb:[T.polyBB[4*p], T.polyBB[4*p+1], T.polyBB[4*p+2], T.polyBB[4*p+3]] };
    for (let ix = Math.floor(b.bb[0]/CELL); ix <= Math.floor(b.bb[2]/CELL); ix++)

      }

}
function nearOf(x, y){
  const out = new Set(), r = Math.ceil(NEAR_R/CELL), cx = Math.floor(x/CELL), cy = Math.floor(y/CELL);

// iterate every edge of a building polygon (all rings)
function edges(b, fn){

/* ---------- cloud forecast (Open-Meteo, hourly, free, no key) ---------- */
const WX = { hours:null };
async function loadWeather(){
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ANTWERP.center[1]}&longitude=${ANTWERP.center[0]}&hourly=cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,temperature_2m&timezone=GMT&past_days=1&forecast_days=2`;
    const r = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const h = (await r.json()).hourly;
    const m = new Map();
    h.time.forEach((ts, i) => {
      const low = h.cloud_cover_low[i], mid = h.cloud_cover_mid[i], high = h.cloud_cover_high[i], cc = h.cloud_cover[i];
      let clear;

    // with the cloudiest of its neighbours, so a lone clear hour reads "partly cloudy · forecast unsure".
    for (const [k, rec] of m){
      const nb = [m.get(k - 3.6e6), rec, m.get(k + 3.6e6)].filter(Boolean).map(x => x.raw);
      const mn = Math.min(...nb), avg = nb.reduce((a, b) => a + b, 0)/nb.length;

}
function wxAt(t){
  if (!WX.hours) return null;

/* ---------- "What does the sky look like?" — the visitor's own eyes beat the forecast ---------- */
const SKY_KEY = 'sunspot-sky-v1', SKY_FULL = 90*60000, SKY_FADE = 60*60000;

    el.innerHTML = 'Sky right now? <button type="button" data-sky="sun" title="Sunny">☀</button><button type="button" data-sky="part" title="Partly cloudy">⛅</button><button type="button" data-sky="cloud" title="Cloudy">☁</button>';

/* ---------- opening hours (common OpenStreetMap formats) ---------- */
const DAYN = { Mo:0, Tu:1, We:2, Th:3, Fr:4, Sa:5, Su:6 };
function parseOH(str){
  if (!str) return null;
  if (String(str).includes('||')){
    const parts = String(str).split('||').map(parseOH1).filter(Boolean);
    if (!parts.length) return null;
    return parts.reduce((acc, d) => acc.map((iv, i) => iv.concat(d[i])));
  }
  return parseOH1(str);
}
function parseOH1(str){
  if (!str) return null;
  str = String(str).trim();
  if (/^24\/7$/.test(str)) return Array.from({ length:7 }, () => [[0, 1440]]);
  str = str.replace(/"[^"]*"/g, '').replace(/\bopen\b/g, '')
           .replace(/(\d|\+|off|closed),\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)\b)/g, '$1;'); // "Mo-Fr 9:00-17:00, Sa 10:00-14:00"
  const days = Array.from({ length:7 }, () => []);
  let any = false;
  for (let rule of str.split(/\s*;\s*/)){
    rule = rule.trim(); if (!rule) continue;
    if (/^(PH|SH)\b/.test(rule)) continue;                                   // public/school holidays: ignore
    // seasonal rules ("Jan-Nov Mo-Sa 10:00-18:00"): keep only those that cover the current month
    const mm = rule.match(/^((?:(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(?:-(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec))?\s*,?\s*)+)\s+(.*)$/);
    if (mm){
      const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], cur = +todayStr().slice(5, 7) - 1;
      let hit = false;
      for (const tok of mm[1].split(',').map(t => t.trim()).filter(Boolean)){
        const [a, b] = tok.split('-').map(m => MON.indexOf(m));
        if (b == null || b < 0 ? cur === a : (a <= b ? cur >= a && cur <= b : cur >= a || cur <= b)) hit = true;
      }
      if (!hit) continue;
      rule = mm[2].trim();
    }
    if (/^(PH|SH)\b/.test(rule)) continue;
    if (/\b(week|easter|sunrise|sunset|dawn|dusk)\b/i.test(rule)) continue; // rules we can't evaluate
    const m = rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?(?:\[[^\]]*\])?\s*,?\s*)+)?(.*)$/);
    const dayPart = (m[1] || '').trim(), timePart = (m[2] || '').trim();
    let ds = [];
    if (!dayPart) ds = [0,1,2,3,4,5,6];
    else for (let tok of dayPart.split(',')){
      tok = tok.replace(/\[.*?\]/, '').trim(); if (!tok || tok === 'PH') continue;
      const [a, b] = tok.split('-');
      if (b && DAYN[a] != null && DAYN[b] != null){ for (let i = DAYN[a]; ; i = (i+1) % 7){ ds.push(i); if (i === DAYN[b]) break; } }
      else if (DAYN[a] != null) ds.push(DAYN[a]);
    }
    if (!ds.length) continue;
    if (/^(off|closed)$/i.test(timePart)){ ds.forEach(d => days[d] = []); any = true; continue; }
    if (!timePart || timePart === '24/7'){ ds.forEach(d => days[d] = [[0, 1440]]); any = true; continue; }
    const iv = [];
    for (const t of timePart.split(/\s*,\s*/)){
      const a = t.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/), b = t.match(/^(\d{1,2}):(\d{2})\+$/);
      if (a){ const s = +a[1]*60 + +a[2]; let e = +a[3]*60 + +a[4]; if (e <= s) e += 1440; if (/\+$/.test(t)) e += 120; iv.push([s, e]); }
      else if (b){ const s = +b[1]*60 + +b[2]; iv.push([s, s + 240]); }       // "18:00+" = open end, assume 4 h
      else return null;                                                       // format we don't understand
    }
    ds.forEach(d => days[d] = iv.slice()); any = true;
  }
  return any ? days : null;
}
// 1 = open, 0 = closed, -1 = unknown
function openAt(days, dow, min){
  if (!days) return -1;
  for (const [s, e] of days[dow]) if (min >= s && min < e) return 1;
  for (const [s, e] of days[(dow + 6) % 7]) if (e > 1440 && min + 1440 >= s && min + 1440 < e) return 1;
  return 0;
}
function openUntil(days, dow, min){
  for (const [s, e] of days[dow]) if (min >= s && min < e) return e % 1440;
  for (const [s, e] of days[(dow + 6) % 7]) if (e > 1440 && min + 1440 >= s && min + 1440 < e) return e - 1440;
  return null;
}
function opensNext(days, dow, min){
  const later = days[dow].filter(([s]) => s > min).sort((a, b) => a[0] - b[0]);
  return later.length ? later[0][0] : null;
}
const fmtMin = m => String(Math.floor(m/60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

/* ---------- the list of cafés & coffee bars (OpenStreetMap, cached for 3 days) ---------- */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
const POI_CACHE = 'sunspot-antwerp-pois-v2';
const POI_FILE = 'antwerp-cafes.json';   // put this file next to the page; refresh it daily with update-cafes.mjs
const terraceTag = v => v == null ? null : /^(yes|terrace|garden|pedestrian_zone|sidewalk|street|patio|veranda|roof)/.test(v) ? 1 : v === 'no' ? 0 : null;
async function loadPois(){
  try {
    const r = await fetch(POI_FILE, { cache:'no-cache', signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined });
    if (r.ok){ const j = await r.json(); if (j && j.pois && j.pois.length){ S.poiSource = 'file'; return j.pois; } }
  } catch(e){ /* not hosted next to the page (or opened as a local file): fall back */ }
  try {
    const c = JSON.parse(localStorage.getItem(POI_CACHE) || 'null');
    if (c && Date.now() - c.t < 3*86400000 && c.pois && c.pois.length) return c.pois;
  } catch(e){}
  const [[w, s], [e, n]] = [ANTWERP.bounds[0], ANTWERP.bounds[1]];
  const q = `[out:json][timeout:25];nwr["amenity"~"^(cafe|bar|pub|biergarten)$"](${s},${w},${n},${e});out center tags;`;
  for (const ep of OVERPASS){
    try {
      const r = await fetch(ep + '?data=' + encodeURIComponent(q), { signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
      if (!r.ok) continue;
      const j = await r.json();
      const pois = [];
      for (const el of j.elements || []){
        const t = el.tags || {}, lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
        if (lat == null || !t.name) continue;
        if (/ice_cream|frozen_yogurt/.test(t.cuisine || '') || NOT_COFFEE.test(t.name)) continue;
        pois.push({ n:t.name, k: t.amenity === 'cafe' ? 'coffee' : 'cafe', la:+lat.toFixed(6), lo:+lon.toFixed(6), oh:t.opening_hours || '', t:terraceTag(t.outdoor_seating) });
      }
      if (pois.length){ try { localStorage.setItem(POI_CACHE, JSON.stringify({ t:Date.now(), pois })); } catch(e){} return pois; }
    } catch(err){ console.warn('overpass', ep, err); }
  }
  return null;
}

function tileKeyOf(lng, lat){ const n = 1 << TZOOM; return TZOOM + '/' + Math.floor(mercX(lng)*n) + '/' + Math.floor(mercY(lat)*n); }
function addCafe(p){
  const dk = p.name + '|' + p.lng.toFixed(4) + ',' + p.lat.toFixed(4);

  $('#clock').textContent = hhmm(slot.t);
  const sunTxt = s.alt >= MIN_ALT ? `Sun ${Math.round(s.alt)}° high in the ${compass(s.az)}` : (s.alt > -1 ? 'Sun on the horizon' : 'Sun is down');
  $('#suninfo').innerHTML = esc(sunTxt) + (w ? ` · <span class="wx">${skyLabel(w)}${w.temp != null ? `, ${Math.round(w.temp)}°C` : ''}</span>` : '');
  updatePaint();
  pushCafes(false);
  updateQuick();
  map.triggerRepaint();
}
function makeSunIcon(){
  const n = 52, cv = document.createElement('canvas'); cv.width = cv.height = n;
  const g = cv.getContext('2d'); g.translate(n/2, n/2);
  g.strokeStyle = '#b26b00'; g.lineCap = 'round'; g.lineWidth = 3.4;
  for (let i = 0; i < 8; i++){ g.rotate(Math.PI/4); g.beginPath(); g.moveTo(0, 15.5); g.lineTo(0, 23); g.stroke(); }
  g.beginPath(); g.arc(0, 0, 11, 0, Math.PI*2); g.fillStyle = '#ffc400'; g.fill(); g.lineWidth = 3; g.stroke();
  return g.getImageData(0, 0, n, n);
}

/* ---------- side list & search ---------- */
let listTimer = null;
function scheduleList(){ if (listTimer) return; listTimer = setTimeout(() => { listTimer = null; renderList(); }, 120); }
const sunnyUntil = (c, i) => { let j = i; while (j <= S.last && c.st[j]) j++; return S.slots[Math.min(j, S.slots.length - 1)].t; };
const nextSun = (c, i) => { for (let j = i; j <= S.last; j++) if (c.st[j]) return S.slots[j].t; return null; };
const kindIcon = c => c.kind === 'coffee' ? '☕' : '🍺';
const kindWord = c => c.kind === 'coffee' ? 'Coffee bar' : 'Café';
let lastListHtml = '';
function statusShort(c){
  const op = isOpenNow(c);
  if (op === 0) return '<span class="u closed">closed</span>';
  if (!c.ready) return '<span class="u dim">…</span>';
  return c.st[S.idx] ? `<span class="u sun">until ${hhmm(sunnyUntil(c, S.idx))}</span>` : '<span class="u dim">shade</span>';
}
/* ---------- ranking: where should I sit? ---------- */
const WALK_M_PER_MIN = 75;
function refPoint(){
  if (S.me && S.me.inside) return { x:S.me.x, y:S.me.y, me:true };
  const c = map.getCenter();
  return { x:(mercX(c.lng) - ORIGIN.ox)/ORIGIN.mpu, y:-(mercY(c.lat) - ORIGIN.oy)/ORIGIN.mpu, me:false };
}
const walkMin = (c, r) => Math.max(1, Math.round(Math.hypot(c.x - r.x, c.y - r.y)*1.3/WALK_M_PER_MIN));
function candidates(r){
  if (r.me) return S.cafes.filter(c => c.ready && passes(c) && Math.hypot(c.x - r.x, c.y - r.y) < 1500);
  const vb = map.getBounds();
  return S.cafes.filter(c => c.ready && passes(c) && vb.contains([c.lng, c.lat]));
}
function score(c, r, walk){
  const i = S.idx, open = isOpenNow(c);
  if (!c.st[i] || open === 0) return -Infinity;
  const left = Math.min((sunnyUntil(c, i) - S.slots[i].t)/60000, 150);
  return left*(0.4 + 0.6*clearNow()) - (r.me ? 2.2 : 0.8)*walk + (open === 1 ? 4 : 0);
}
const terraceIcon = () => '';
function bestCard(r, ranked, cands){
  const slot = S.slots[S.idx], when = Math.abs(slot.t - Date.now()) < 10*60000 ? 'now' : `at ${hhmm(slot.t)}`;
  if (slot.sun.alt < MIN_ALT) return `<div class="best muted">The sun is down ${when === 'now' ? 'right now' : when}. Slide to daytime to find a sunny spot.</div>`;
  const top = ranked[0];
  if (top){
    const c = top.c, open = isOpenNow(c);
    return `<div class="best" data-id="${c.id}" role="button" tabindex="0">
      <div class="best-k">Best pick ${when}${r.me ? ' near you' : ''}</div>
      <div class="best-n">${kindIcon(c)} ${esc(c.name)}${terraceIcon(c)}</div>
      <div class="best-d">☀ sun until ${hhmm(sunnyUntil(c, S.idx))} · ${top.walk} min walk${open === 1 ? ' · open' : ''}${clearNow() < 0.4 ? ' · but cloudy' : ''}</div></div>`;
  }
  // nothing sunny now: earliest next sun nearby
  let next = null;
  for (const c of cands){ const t = nextSun(c, S.idx); if (t && (!next || t < next.t)) next = { c, t }; }
  return next ? `<div class="best muted" data-id="${next.c.id}" role="button" tabindex="0">No sunny terrace ${when}${r.me ? ' near you' : ' here'}. Next sun: <b>${esc(next.c.name)}</b> at ${hhmm(next.t)}.</div>`
              : `<div class="best muted">No sunny spot ${when}${r.me ? ' near you' : ' in view'} for the rest of the day.</div>`;
}
function renderList(){
  const q = normalize($('#search').value);
  let html, best = '';
  if (q){
    const r = refPoint();
    const hits = S.cafes.filter(c => kindOn(c) && c.norm.includes(q))
      .sort((a, b) => (a.norm.startsWith(q) ? 0 : 1) - (b.norm.startsWith(q) ? 0 : 1) || a.name.localeCompare(b.name)).slice(0, 40);
    $('#count').innerHTML = `<b>${hits.length}</b> place${hits.length === 1 ? '' : 's'} match “${esc($('#search').value.trim())}”`;
    html = hits.length ? hits.map(c => `<div class="cafe" data-id="${c.id}"><span class="n">${kindIcon(c)} ${esc(c.name)}${terraceIcon(c)}</span>${r.me ? `<span class="u dim">${walkMin(c, r)} min · </span>` : ''}${statusShort(c)}</div>`).join('')
      : '<div class="hint">No café or coffee bar with that name. Check the spelling, or switch on both filters.</div>';
  } else if (map.getZoom() < TZOOM - 0.5 && !(S.me && S.me.inside)){
    $('#count').textContent = 'Zoom in to see cafés, coffee bars and shadows.';
    html = '<div class="hint">Or tap 📍 Near me, or search for a place by name.</div><button class="btn zoomin" id="zoomin">Zoom in here</button>';
  } else {
    const r = refPoint(), cands = candidates(r);
    const ranked = cands.map(c => ({ c, walk:walkMin(c, r) })).map(o => ({ ...o, s:score(o.c, r, o.walk) }))
      .filter(o => o.s > -Infinity).sort((a, b) => b.s - a.s);
    best = bestCard(r, ranked, cands);
    const sunDown = S.slots[S.idx].sun.alt < MIN_ALT;
    const noun = F.coffee && F.cafe ? 'places' : F.coffee ? 'coffee bars' : F.cafe ? 'cafés' : 'places';
    const where = r.me ? 'within 15 min walk' : 'in view';
    $('#count').innerHTML = !F.coffee && !F.cafe ? 'Switch on Coffee bars or Cafés to see places.'
      : sunDown ? `${cands.length} ${noun} ${where}`
      : `<b>${ranked.length}</b> of ${cands.length} ${noun} ${where} in the sun${S.slots[S.idx].wx ? ` · ${skyLabel(S.slots[S.idx].wx)}` : ''}`;
    html = ranked.slice(1, 80).map(({ c, walk }) => `<div class="cafe" data-id="${c.id}"><span class="n">${kindIcon(c)} ${esc(c.name)}${terraceIcon(c)}</span><span class="u sun">${walk} min · until ${hhmm(sunnyUntil(c, S.idx))}</span></div>`).join('')
      || (ranked.length ? '' : `<div class="hint">${sunDown ? '' : cands.length ? 'Try another hour, move the map or change the filters.' : inflight ? 'Loading…' : 'Nothing here. Move the map to a busier street, or change the filters.'}</div>`);
  }
  if (best !== lastBest){ $('#best').innerHTML = best; lastBest = best; }
  if (html !== lastListHtml){ $('#list').innerHTML = html; lastListHtml = html; }
}
let lastBest = '';
$('#best').addEventListener('click', e => { const el = e.target.closest('[data-id]'); if (el) focusCafe(+el.dataset.id); });
$('#best').addEventListener('keydown', e => { if (e.key === 'Enter'){ const el = e.target.closest('[data-id]'); if (el) focusCafe(+el.dataset.id); } });
function focusCafe(id, zoomIn = true){
  const c = S.cafes[id]; if (!c) return;
  if (isPhone()) setSheet(false);
  // keep the place (and its popup, which opens above it) clear of the panel and the time bar
  const pad = isPhone() ? { top:Math.min(320, window.innerHeight*0.45), bottom:200, left:0, right:0 } : { left:340, bottom:120, top:200, right:40 };
  map.easeTo({ center:[c.lng, c.lat], zoom:zoomIn ? Math.max(map.getZoom(), 17.2) : map.getZoom(), duration:700, padding:pad });
  highlight(c);
  openPopup(c.id);
  setHash(c);
}
let hlTimer = null;
function highlight(c){
  const src = map.getSource('hl'); if (!src) return;
  src.setData({ type:'FeatureCollection', features:[{ type:'Feature', geometry:{ type:'Point', coordinates:[c.lng, c.lat] }, properties:{} }] });
  clearInterval(hlTimer); let k = 0;
  hlTimer = setInterval(() => { k++; map.setPaintProperty('hl-ring', 'circle-radius', 16 + 8*Math.abs(Math.sin(k/4))); if (k > 60){ clearInterval(hlTimer); map.setPaintProperty('hl-ring', 'circle-radius', 18); } }, 50);
}
function clearHighlight(){ clearInterval(hlTimer); const src = map.getSource('hl'); if (src) src.setData({ type:'FeatureCollection', features:[] }); }

/* ---------- shareable links: …/#cafe-kulminator ---------- */
function slugOf(c){ return c.slug || (c.slug = 'cafe-' + (normalize(c.name).replace(/ /g, '-') || 'place')); }
function buildSlugs(){
  const seen = new Map();
  for (const c of S.cafes){ c.slug = null; let sl = slugOf(c); const n = (seen.get(sl) || 0) + 1; seen.set(sl, n); if (n > 1) c.slug = sl + '-' + n; }
}
function setHash(c){ try { history.replaceState(null, '', '#' + slugOf(c)); } catch(e){} }
function openFromHash(){
  const h = decodeURIComponent((location.hash || '').slice(1)); if (!h.startsWith('cafe-')) return false;
  const c = S.cafes.find(x => slugOf(x) === h); if (!c) return false;
  focusCafe(c.id); return true;
}
window.addEventListener('hashchange', openFromHash);
async function shareCafe(id){
  const c = S.cafes[id]; if (!c) return;
  const url = location.href.split('#')[0] + '#' + slugOf(c);
  try { if (navigator.share){ await navigator.share({ title:c.name + ' · Sunnyspots', text:`${c.name}: sunny terrace in Antwerp`, url }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toastPopup('Link copied'); } catch(e){ toastPopup(url); }
}
function toastPopup(msg){ const el = document.querySelector('.pop-actions .msg'); if (el){ el.textContent = msg; setTimeout(() => { el.textContent = ''; }, 2500); } }
function reportUrl(c){
  const slot = S.slots[S.idx], said = !c.ready ? 'unknown' : c.st[S.idx] ? 'in the sun' : 'in the shade';
  const body = `**Place:** ${c.name}\n**Time:** ${S.date} ${hhmm(slot.t)}\n**The app said:** ${said}\n**What I saw:** \n\n_Location: ${c.lat0.toFixed(5)}, ${c.lng0.toFixed(5)} · ${location.href.split('#')[0]}#${slugOf(c)}_`;
  return `https://github.com/LoreOpdeBeeck/sunnyspots/issues/new?title=${encodeURIComponent('Wrong sun/shade: ' + c.name)}&body=${encodeURIComponent(body)}&labels=feedback`;
}
const isPhone = () => window.matchMedia && window.matchMedia('(max-width:700px)').matches;
function setSheet(open){ $('.panel').classList.toggle('expanded', open); $('#sheet').setAttribute('aria-expanded', open); $('#sheet').textContent = open ? '▼' : '▲'; }
$('#sheet').addEventListener('click', () => setSheet(!$('.panel').classList.contains('expanded')));
$('#search').addEventListener('focus', () => { if (isPhone()) setSheet(true); });

let searchTimer = null;
$('#search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderList, 120); });
$('#search').addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.target.value = ''; renderList(); }
  if (e.key === 'Enter'){ const first = $('#list .cafe'); if (first) first.click(); }
});
$('#list').addEventListener('click', e => {
  if (e.target.id === 'zoomin'){ map.easeTo({ zoom:15.6, duration:600 }); return; }
  const el = e.target.closest('.cafe'); if (el) focusCafe(+el.dataset.id);
});
function mixHex(a, b, k){ const h = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16)); const A = h(a), B = h(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v)*k).toString(16).padStart(2, '0')).join(''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* ---------- popup ---------- */
let popup = null, popupId = null;
function hoursHtml(c){
  const slot = S.slots[S.idx], op = isOpenNow(c);
  if (op === -1) return `<div class="oh">${c.oh ? 'Opening hours: ' + esc(c.oh) : 'Opening hours unknown'}</div>`;
  if (op === 1){ const u = openUntil(c.hours, slot.dow, slot.min); return `<div class="oh open">Open${u != null && u !== 0 ? ` until ${fmtMin(u)}` : u === 0 ? ' until midnight' : ''}</div>`; }
  const nx = opensNext(c.hours, slot.dow, slot.min);
  return `<div class="oh closed">Closed at ${hhmm(slot.t)}${nx != null ? ` · opens ${fmtMin(nx)}` : ''}</div>`;
}
function openPopup(id, refreshOnly){
  const c = S.cafes[id]; if (!c) return;
  let body;
  if (!c.ready){
    body = '<div class="now-shade">Checking the sun here…</div>';
  } else {
    const periods = []; let s0 = -1;
    for (let i = S.first; i <= S.last + 1; i++){
      const on = i <= S.last && c.st[i];
      if (on && s0 < 0) s0 = i;
      if (!on && s0 >= 0){ periods.push(`${hhmm(S.slots[s0].t)}–${hhmm(S.slots[i].t)}`); s0 = -1; }
    }
    const ns = nextSun(c, S.idx), w = S.slots[S.idx].wx;
    body = (c.st[S.idx] ? `<div class="now-sun">☀ In the sun until ${hhmm(sunnyUntil(c, S.idx))}</div>` : `<div class="now-shade">In the shade${ns ? ` · sun again at ${hhmm(ns)}` : ''}</div>`)
      + (w ? `<div style="color:#6b6f7a">${skyLabel(w)} at ${hhmm(S.slots[S.idx].t)}${w.cc != null && !w.user ? ` · forecast ${w.cc}% cloud` : ''}</div>` : '')
      + (periods.length ? `<div style="margin-top:6px;color:#6b6f7a">In direct sun today (if no clouds):</div><ul>${periods.map(p => `<li>${p}</li>`).join('')}</ul>` : '<div style="margin-top:6px;color:#6b6f7a">No direct sun here today.</div>');
  }
  const r = refPoint();
  const extra = r.me ? `<div class="oh">${walkMin(c, r)} min walk</div>` : '';
  const gm = `https://www.google.com/maps/dir/?api=1&destination=${c.lat0},${c.lng0}&travelmode=walking`;
  const html = `<div class="kind">${kindIcon(c)} ${kindWord(c)}</div><h3>${esc(c.name)}</h3>${hoursHtml(c)}${extra}${body}<div class="pop-actions"><a href="${gm}" target="_blank" rel="noopener">Walk there</a><button type="button" data-share="${c.id}">Share</button><a href="${reportUrl(c)}" target="_blank" rel="noopener">Wrong? Report it</a><span class="msg" aria-live="polite"></span></div><div class="fine">Sun is estimated from building shapes and heights. Trees and awnings are not included.</div>`;
  if (refreshOnly){ if (popup && popup.isOpen()) popup.setHTML(html); return; }
  if (popup) popup.remove();
  popupId = id;
  popup = new maplibregl.Popup({ offset:14, maxWidth:'290px', anchor:'bottom' }).setLngLat([c.lng, c.lat]).setHTML(html).addTo(map);
  popup.on('close', () => { if (popupId === id){ popupId = null; clearHighlight(); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} } });
}

document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-share]'); if (b) shareCafe(+b.dataset.share); });

/* ---------- controls ---------- */
let raf = null;
$('#slider').addEventListener('input', e => { S.idx = +e.target.value; if (!raf) raf = requestAnimationFrame(() => { raf = null; updateTime(); }); });
document.body.insertAdjacentHTML('beforeend', '<button id="now" hidden></button>');
$('#now').addEventListener('click', () => {
  if (S.date !== todayStr()){ // page left open past midnight: switch to the new day
    S.date = todayStr(); buildDay(); for (const c of S.cafes){ computeOpen(c); if (c.ready) computeCafe(c); } applyWeather();
  }
  S.idx = pickDefaultIdx(); $('#slider').value = S.idx; updateTime();
});
function nowIdx(){ return Math.round((Date.now() - S.slots[0].t)/(STEP_MIN*60000)); }
document.querySelectorAll('.btn.q').forEach(b => b.addEventListener('click', () => {
  if (S.date !== todayStr()) $('#now').click();
  S.idx = Math.min(Math.max(nowIdx() + Math.round(+b.dataset.q/STEP_MIN), S.first), S.last);
  $('#slider').value = S.idx; updateTime();
}));
function updateQuick(){
  const n = nowIdx();
  document.querySelectorAll('.btn.q').forEach(b => {
    const target = Math.min(Math.max(n + Math.round(+b.dataset.q/STEP_MIN), S.first), S.last);
    b.classList.toggle('on', target === S.idx);
    b.disabled = +b.dataset.q > 0 && n + Math.round(+b.dataset.q/STEP_MIN) > S.last;   // after sunset
  });
  const span = S.last - S.first, frac = span > 0 ? Math.min(Math.max((n - S.first)/span, 0), 1) : 0;
  $('#past').style.width = (frac*100).toFixed(2) + '%';
}
setInterval(() => { updateQuick(); }, 60000);
$('#suninfo').insertAdjacentHTML('afterend', '<span id="loading"></span>');
$('#nearme').addEventListener('click', () => { geo.trigger(); if (isPhone()) setSheet(false); });
</script>
</body>
</html>
